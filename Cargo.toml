[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
authors = ["Kacper 'Obryk Obrycki"]
description = "Advent of Code solutions"

[workspace.dependencies]
aoc-common = { path = "crates/common" }
aoc-core = { path = "crates/core" }
aoc-client = { path = "crates/client" }
aoc-solutions = { path = "crates/solutions" }

[workspace.lints]
rust = {unsafe_code = "forbid" }
clippy = { all = { level = "warn", priority = -1 }, pedantic = { level = "warn", priority = -1 } }

