[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
authors = ["Kacper 'Obryk' Obrycki"]
description = "Advent of Code solutions"

[workspace.dependencies]
aoc-common = { path = "crates/common" }

aoc-toolkit = {
    path = "../aoc-toolkit",
    default-features = false,
    features = ["runner"]
}

[workspace.lints]
rust = {unsafe_code = "forbid" }
clippy = { all = { level = "warn", priority = -1 }, pedantic = { level = "warn", priority = -1 } }

