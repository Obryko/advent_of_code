[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
aoc-common = { path = "crates/common" }

[workspace.lints]
rust = {unsafe_code = "forbid" }
clippy = { all = { level = "warn", priority = -1 }, pedantic = { level = "warn", priority = -1 } }

[workspace.package]
version = "0.0.0"
edition = "2024"
authors = ["Kacper 'Obryk Obrycki"]
description = "Advent of Code solutions"

[package]
name = "advent_of_code"
version = "0.1.0"
edition = "2024"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aoc-common.workspace = true
clap = { version = "4", features = ['derive'] }
dotenvy = "0.15"
reqwest = { version = "0.13", features = ["blocking"]}
